name: Build Desktop App (Windows & Linux)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew and scripts
        run: |
          chmod +x gradlew
          chmod +x scripts/*.sh

      - name: Run Tests
        run: ./gradlew test

      - name: Package Standalone Linux Distribution
        run: ./gradlew createDistributable

      - name: Build Linux Tarball
        run: bash scripts/build-linux-tarball.sh

      - name: Build Linux AppImage
        run: bash scripts/build-linux-appimage.sh

      - name: Prepare Assets Directory
        run: |
          mkdir -p dist
          cp build/compose/binaries/main/tarball/*.tar.gz dist/
          cp build/compose/binaries/main/appimage/*.AppImage dist/
          ls -la dist/
          sha256sum dist/*

      - name: Upload Linux Dist Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Boumusic-Linux-v2.1.0-Binaries
          path: dist/*

      - name: Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v2.1.0 dist/* --clobber
