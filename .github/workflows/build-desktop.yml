name: Build Desktop App (Windows & Linux)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Tests
        run: ./gradlew test

      - name: Package Windows Distribution
        run: ./gradlew packageDistributionForCurrentOS

      - name: Compress Windows Distribution
        run: |
          Compress-Archive -Path build/compose/binaries/main/app/* -DestinationPath Boumusic-Windows-x64.zip -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Boumusic-Windows-x64
          path: Boumusic-Windows-x64.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Tests
        run: ./gradlew test

      - name: Package Linux Distribution
        run: ./gradlew packageDistributionForCurrentOS

      - name: Compress Linux Distribution
        run: |
          tar -czf Boumusic-Linux-x64.tar.gz -C build/compose/binaries/main/app .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Boumusic-Linux-x64
          path: Boumusic-Linux-x64.tar.gz

  release:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: Boumusic-Windows-x64

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: Boumusic-Linux-x64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            Boumusic-Windows-x64.zip
            Boumusic-Linux-x64.tar.gz
