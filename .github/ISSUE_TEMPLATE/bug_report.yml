name: Reporte de Error (Bug)
description: Informa de un problema o comportamiento inesperado en Boumusic Desktop
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Gracias por tomarte el tiempo de reportar este problema para ayudar a mejorar Boumusic Desktop.
  - type: input
    id: version
    attributes:
      label: Versión de Boumusic Desktop
      description: ¿Qué versión estás utilizando (ej. v2.0.1)?
      placeholder: v2.0.1
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Sistema Operativo
      options:
        - Windows 11
        - Windows 10
        - Linux (Ubuntu / Debian)
        - Linux (Arch / Fedora)
        - Otro
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Descripción del problema
      description: Explica de forma clara y concisa qué ha ocurrido.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Pasos para reproducir
      description: Pasos exactos para que podamos reproducir el error.
      value: |
        1. Ir a '...'
        2. Hacer clic en '...'
        3. Observar el error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
      description: ¿Qué debería haber ocurrido?
    validations:
      required: false
