<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 640" width="1024" height="640">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0a14"/>
      <stop offset="100%" stop-color="#140e20"/>
    </linearGradient>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#7B2CBF"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="640" rx="12" fill="url(#bg4)" stroke="#3d2c54" stroke-width="1.5"/>

  <!-- TitleBar -->
  <rect width="1024" height="38" rx="12" fill="#181126"/>
  <rect y="26" width="1024" height="12" fill="#181126"/>
  <circle cx="20" cy="19" r="6" fill="#EF4444"/>
  <circle cx="38" cy="19" r="6" fill="#F59E0B"/>
  <circle cx="56" cy="19" r="6" fill="#10B981"/>
  <text x="512" y="24" fill="#d0b8f0" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Boumusic Desktop — Personalización Visual (Colores, Temas y Fondos)</text>

  <!-- Sidebar -->
  <rect x="0" y="38" width="220" height="602" fill="#120c1e"/>
  <line x1="220" y1="38" x2="220" y2="640" stroke="#2c1e44" stroke-width="1"/>
  <text x="24" y="76" fill="#00F5D4" font-family="sans-serif" font-size="20" font-weight="900">⚡ BOUMUSIC</text>

  <text x="32" y="123" fill="#a08cb8" font-family="sans-serif" font-size="13">🎵  Biblioteca Local</text>
  <text x="32" y="162" fill="#a08cb8" font-family="sans-serif" font-size="13">📑  Listas de Reproducción</text>
  <text x="32" y="200" fill="#a08cb8" font-family="sans-serif" font-size="13">⏳  Cola de Reproducción</text>
  <text x="32" y="238" fill="#a08cb8" font-family="sans-serif" font-size="13">⬇️  Descargas (SpotDL)</text>
  <text x="32" y="276" fill="#a08cb8" font-family="sans-serif" font-size="13">🌐  Servidores Remotos</text>
  <text x="32" y="314" fill="#a08cb8" font-family="sans-serif" font-size="13">🔄  Sincronización &amp; Backup</text>
  <text x="32" y="352" fill="#a08cb8" font-family="sans-serif" font-size="13">🎛️  Ecualizador &amp; Gapless</text>
  
  <!-- Active Tab -->
  <rect x="12" y="376" width="196" height="36" rx="8" fill="#241738"/>
  <rect x="12" y="376" width="3" height="36" rx="1.5" fill="#00F5D4"/>
  <text x="32" y="399" fill="#00F5D4" font-family="sans-serif" font-size="13" font-weight="700">🎨  Personalización UI</text>

  <!-- Main Content Header -->
  <text x="250" y="80" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="800">Personalización de Interfaz</text>
  <text x="250" y="100" fill="#b09cca" font-family="sans-serif" font-size="12">Configura la paleta cromática, temas ciberpunk predefinidos y fondos de pantalla personalizados</text>

