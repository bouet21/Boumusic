  <text x="250" y="130" fill="#e0d0f8" font-family="sans-serif" font-size="12" font-weight="700">TEMAS PREDEFINIDOS:</text>

  <!-- Theme 1 (Selected): Cyberpunk -->
  <rect x="250" y="142" width="134" height="68" rx="10" fill="#1e1330" stroke="#00F5D4" stroke-width="2"/>
  <circle cx="272" cy="166" r="10" fill="#00F5D4"/>
  <circle cx="296" cy="166" r="10" fill="#7B2CBF"/>
  <text x="272" y="196" fill="#00F5D4" font-family="sans-serif" font-size="11" font-weight="700">✓ Cyberpunk</text>

  <!-- Theme 2: Midnight AMOLED -->
  <rect x="396" y="142" width="134" height="68" rx="10" fill="#08080a" stroke="#252530" stroke-width="1"/>
  <circle cx="418" cy="166" r="10" fill="#ffffff"/>
  <circle cx="442" cy="166" r="10" fill="#3b82f6"/>
  <text x="418" y="196" fill="#a0a0b2" font-family="sans-serif" font-size="11" font-weight="600">Midnight AMOLED</text>

  <!-- Theme 3: Neon Sunset -->
  <rect x="542" y="142" width="134" height="68" rx="10" fill="#201018" stroke="#3d1e2e" stroke-width="1"/>
  <circle cx="564" cy="166" r="10" fill="#ec4899"/>
  <circle cx="588" cy="166" r="10" fill="#f59e0b"/>
  <text x="564" y="196" fill="#a0a0b2" font-family="sans-serif" font-size="11" font-weight="600">Neon Sunset</text>

  <!-- Theme 4: Emerald Matrix -->
  <rect x="688" y="142" width="134" height="68" rx="10" fill="#0c1a14" stroke="#16382a" stroke-width="1"/>
  <circle cx="710" cy="166" r="10" fill="#10b981"/>
  <circle cx="734" cy="166" r="10" fill="#064e3b"/>
  <text x="710" y="196" fill="#a0a0b2" font-family="sans-serif" font-size="11" font-weight="600">Emerald Matrix</text>

  <!-- Theme 5: Synthwave 80s -->
  <rect x="834" y="142" width="134" height="68" rx="10" fill="#1a102a" stroke="#361a55" stroke-width="1"/>
  <circle cx="856" cy="166" r="10" fill="#a855f7"/>
  <circle cx="880" cy="166" r="10" fill="#06b6d4"/>
  <text x="856" y="196" fill="#a0a0b2" font-family="sans-serif" font-size="11" font-weight="600">Synthwave 80s</text>

  <!-- Wallpaper & Background Card -->
  <rect x="250" y="230" width="718" height="200" rx="14" fill="#1c122c" stroke="#3a2554" stroke-width="1"/>
  <text x="274" y="260" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="800">Fondo de Pantalla Personalizado</text>
  <text x="274" y="280" fill="#b09cca" font-family="sans-serif" font-size="11">Carga cualquier imagen (PNG, JPG, WebP) visible en todas las pantallas con transparencia adaptativa</text>

  <!-- Wallpaper Preview Box -->
  <rect x="274" y="300" width="180" height="110" rx="10" fill="#2d1d44" stroke="#00F5D4" stroke-width="1.5"/>
  <rect x="274" y="300" width="180" height="110" rx="10" fill="url(#cyberGrad)" opacity="0.35"/>
  <text x="364" y="360" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">🖼️ wallpaper_cyber.png</text>

  <!-- Wallpaper Controls -->
  <rect x="476" y="300" width="160" height="34" rx="8" fill="#7B2CBF"/>
  <text x="556" y="322" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Seleccionar Imagen...</text>

  <rect x="646" y="300" width="110" height="34" rx="8" fill="#25173a" stroke="#482d6e" stroke-width="1"/>
  <text x="701" y="322" fill="#d0b8f0" font-family="sans-serif" font-size="12" text-anchor="middle">Quitar Fondo</text>

  <text x="476" y="366" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">Atenuación de Fondo (Dimming): 45%</text>
  <rect x="476" y="378" width="300" height="6" rx="3" fill="#36224e"/>
  <rect x="476" y="378" width="135" height="6" rx="3" fill="#00F5D4"/>
  <circle cx="611" cy="381" r="6" fill="#ffffff"/>

  <!-- Animations & Performance Card -->
  <rect x="250" y="448" width="718" height="165" rx="14" fill="#1c122c" stroke="#3a2554" stroke-width="1"/>
  <text x="274" y="478" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="800">Animaciones y Efectos</text>

  <text x="274" y="512" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">Transiciones de pantalla y efectos de brillo neón</text>
  <text x="274" y="528" fill="#b09cca" font-family="sans-serif" font-size="11">Desactivar para rendimiento extremo en portátiles con batería baja</text>
  <rect x="890" y="505" width="46" height="24" rx="12" fill="#00F5D4"/>
  <circle cx="924" cy="517" r="9" fill="#0a0a0c"/>

  <line x1="274" y1="548" x2="936" y2="548" stroke="#2d1c44" stroke-width="1"/>

  <text x="274" y="575" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">Integración con Barra de Título Nativa Oscura (DWM Windows 11/10)</text>
  <rect x="890" y="565" width="46" height="24" rx="12" fill="#7B2CBF"/>
  <circle cx="924" cy="577" r="9" fill="#ffffff"/>
</svg>
