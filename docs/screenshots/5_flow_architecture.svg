<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 480" width="1024" height="480">
  <defs>
    <linearGradient id="bgFlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0e"/>
      <stop offset="100%" stop-color="#14141e"/>
    </linearGradient>
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#7B2CBF"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="480" rx="14" fill="url(#bgFlow)" stroke="#282838" stroke-width="1.5"/>

  <text x="512" y="44" fill="#00F5D4" font-family="sans-serif" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="1">⚡ ARQUITECTURA Y FLUJO DE REPRODUCCIÓN EN BOUMUSIC</text>
  <text x="512" y="66" fill="#8e8ea0" font-family="sans-serif" font-size="12" text-anchor="middle">Streaming remoto continuo, motor PCM de alta fidelidad e integración nativa con el sistema operativo</text>

  <!-- Column 1: Fuentes de Audio / Servidores -->
  <rect x="40" y="96" width="280" height="340" rx="12" fill="#13131c" stroke="#2a2a3c" stroke-width="1"/>
  <rect x="40" y="96" width="280" height="38" rx="12" fill="#191924"/>
  <text x="56" y="120" fill="#00F5D4" font-family="sans-serif" font-size="13" font-weight="800">1. FUENTES DE AUDIO REMOTAS &amp; LOCAL</text>

  <!-- Subsonic / Navidrome Item -->
  <rect x="56" y="148" width="248" height="54" rx="8" fill="#1b1c28" stroke="#00F5D4" stroke-width="1"/>
  <text x="70" y="170" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">📡 Subsonic / Navidrome / Jellyfin</text>
  <text x="70" y="188" fill="#8e8ea0" font-family="sans-serif" font-size="10">REST API v1.16.1 • Token Salt MD5 • Stream PCM</text>

  <!-- SMB Item -->
  <rect x="56" y="214" width="248" height="54" rx="8" fill="#171722" stroke="#2e2e42" stroke-width="1"/>
  <text x="70" y="236" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">🗄️ Carpetas SMB2 / SMB3</text>
  <text x="70" y="254" fill="#8e8ea0" font-family="sans-serif" font-size="10">Puerto 445 nativo Windows &amp; Linux Samba</text>

  <!-- WebDAV / FTPS Item -->
  <rect x="56" y="280" width="248" height="54" rx="8" fill="#171722" stroke="#2e2e42" stroke-width="1"/>
  <text x="70" y="302" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">☁️ WebDAV / Nextcloud / FTPS</text>
  <text x="70" y="320" fill="#8e8ea0" font-family="sans-serif" font-size="10">HTTPS PROPFIND • Cifrado TLS 1.3</text>

  <!-- Local Storage Item -->
  <rect x="56" y="346" width="248" height="54" rx="8" fill="#171722" stroke="#2e2e42" stroke-width="1"/>
  <text x="70" y="368" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">💾 Almacenamiento Local Directo</text>
  <text x="70" y="386" fill="#8e8ea0" font-family="sans-serif" font-size="10">FLAC • MP3 • WAV • OGG • OPUS • M4A</text>

  <!-- Connection Arrow 1 -> 2 -->
  <path d="M 320 266 L 368 266" stroke="#00F5D4" stroke-width="3" stroke-dasharray="4" fill="none"/>
  <polygon points="368,261 378,266 368,271" fill="#00F5D4"/>

  <!-- Column 2: Motor de Audio -->
  <rect x="372" y="96" width="280" height="340" rx="12" fill="#161224" stroke="#7B2CBF" stroke-width="1.5"/>
  <rect x="372" y="96" width="280" height="38" rx="12" fill="#241938"/>
  <text x="388" y="120" fill="#c084fc" font-family="sans-serif" font-size="13" font-weight="800">2. MOTOR DE AUDIO (ALTA FIDELIDAD)</text>

  <!-- Gapless Item -->
  <rect x="388" y="148" width="248" height="54" rx="8" fill="#201732" stroke="#7B2CBF" stroke-width="1"/>
  <text x="402" y="170" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">⚡ Reproducción Gapless (0ms)</text>
  <text x="402" y="188" fill="#c084fc" font-family="sans-serif" font-size="10">Pre-buffer inteligente • Transición DAC continua</text>

  <!-- ReplayGain Item -->
  <rect x="388" y="214" width="248" height="54" rx="8" fill="#201732" stroke="#7B2CBF" stroke-width="1"/>
  <text x="402" y="236" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">🎚️ Normalización ReplayGain / EBU</text>
  <text x="402" y="254" fill="#c084fc" font-family="sans-serif" font-size="10">Escalado PCM dinámico con limitador suave</text>

  <!-- Equalizer Item -->
  <rect x="388" y="280" width="248" height="54" rx="8" fill="#201732" stroke="#7B2CBF" stroke-width="1"/>
  <text x="402" y="302" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">🎛️ Ecualizador 5 Bandas (Biquad IIR)</text>
  <text x="402" y="320" fill="#c084fc" font-family="sans-serif" font-size="10">Filtros paramétricos Peaking + Bass Boost</text>

  <!-- Metadata Extractor -->
  <rect x="388" y="346" width="248" height="54" rx="8" fill="#201732" stroke="#7B2CBF" stroke-width="1"/>
  <text x="402" y="368" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">🏷️ Extracción ID3v2 &amp; Vorbis en Stream</text>
  <text x="402" y="386" fill="#c084fc" font-family="sans-serif" font-size="10">Carátulas en caché y metadatos limpios</text>

  <!-- Connection Arrow 2 -> 3 -->
  <path d="M 652 266 L 700 266" stroke="#7B2CBF" stroke-width="3" stroke-dasharray="4" fill="none"/>
  <polygon points="700,261 710,266 700,271" fill="#7B2CBF"/>

  <!-- Column 3: Integración SO & Salida -->
  <rect x="704" y="96" width="280" height="340" rx="12" fill="#13131c" stroke="#2a2a3c" stroke-width="1"/>
  <rect x="704" y="96" width="280" height="38" rx="12" fill="#191924"/>
  <text x="720" y="120" fill="#00F5D4" font-family="sans-serif" font-size="13" font-weight="800">3. SISTEMA OPERATIVO &amp; SALIDA</text>

  <!-- Media Keys Item -->
  <rect x="720" y="148" width="248" height="54" rx="8" fill="#192625" stroke="#00F5D4" stroke-width="1"/>
  <text x="734" y="170" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">⌨️ Teclas Multimedia Globales</text>
  <text x="734" y="188" fill="#00F5D4" font-family="sans-serif" font-size="10">Play/Pause, Next, Prev sin foco en ventana</text>

  <!-- System Tray Item -->
  <rect x="720" y="214" width="248" height="54" rx="8" fill="#171722" stroke="#2e2e42" stroke-width="1"/>
  <text x="734" y="236" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">📌 Bandeja del Sistema (Tray)</text>
  <text x="734" y="254" fill="#8e8ea0" font-family="sans-serif" font-size="10">Menú contextual y control rápido minimizado</text>

  <!-- Dark TitleBar DWM -->
  <rect x="720" y="280" width="248" height="54" rx="8" fill="#171722" stroke="#2e2e42" stroke-width="1"/>
  <text x="734" y="302" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">🪟 Barra Nativa Oscura (DWM)</text>
  <text x="734" y="320" fill="#8e8ea0" font-family="sans-serif" font-size="10">JNA DwmSetWindowAttribute Windows 11/10</text>

  <!-- Audio DAC Output -->
  <rect x="720" y="346" width="248" height="54" rx="8" fill="#171722" stroke="#2e2e42" stroke-width="1"/>
  <text x="734" y="368" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">🔊 Salida Hardware de Sonido</text>
  <text x="734" y="386" fill="#8e8ea0" font-family="sans-serif" font-size="10">16-bit PCM • Buffer ~80ms de baja latencia</text>
</svg>
