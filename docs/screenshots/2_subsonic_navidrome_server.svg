<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 640" width="1024" height="640">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#121216"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="640" rx="12" fill="url(#bg2)" stroke="#2d2d38" stroke-width="1.5"/>

  <!-- TitleBar -->
  <rect width="1024" height="38" rx="12" fill="#14141a"/>
  <rect y="26" width="1024" height="12" fill="#14141a"/>
  <circle cx="20" cy="19" r="6" fill="#EF4444"/>
  <circle cx="38" cy="19" r="6" fill="#F59E0B"/>
  <circle cx="56" cy="19" r="6" fill="#10B981"/>
  <text x="512" y="24" fill="#a0a0b2" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Boumusic Desktop — Servidores Remotos (Subsonic / Navidrome / SMB)</text>

  <!-- Sidebar -->
  <rect x="0" y="38" width="220" height="602" fill="#0f0f14"/>
  <line x1="220" y1="38" x2="220" y2="640" stroke="#23232e" stroke-width="1"/>
  <text x="24" y="76" fill="#00F5D4" font-family="sans-serif" font-size="20" font-weight="900">⚡ BOUMUSIC</text>

  <text x="32" y="123" fill="#8e8ea0" font-family="sans-serif" font-size="13">🎵  Biblioteca Local</text>
  <text x="32" y="162" fill="#8e8ea0" font-family="sans-serif" font-size="13">📑  Listas de Reproducción</text>
  <text x="32" y="200" fill="#8e8ea0" font-family="sans-serif" font-size="13">⏳  Cola de Reproducción</text>
  <text x="32" y="238" fill="#8e8ea0" font-family="sans-serif" font-size="13">⬇️  Descargas (SpotDL)</text>
  
  <rect x="12" y="260" width="196" height="36" rx="8" fill="#1f1f2c"/>
  <rect x="12" y="260" width="3" height="36" rx="1.5" fill="#00F5D4"/>
  <text x="32" y="283" fill="#00F5D4" font-family="sans-serif" font-size="13" font-weight="700">🌐  Servidores Remotos</text>

  <text x="32" y="322" fill="#8e8ea0" font-family="sans-serif" font-size="13">🔄  Sincronización &amp; Backup</text>
  <text x="32" y="360" fill="#8e8ea0" font-family="sans-serif" font-size="13">🎛️  Ecualizador &amp; Gapless</text>
  <text x="32" y="398" fill="#8e8ea0" font-family="sans-serif" font-size="13">🎨  Personalización UI</text>

  <!-- Main Content Area: Remote Servers List -->
  <text x="250" y="80" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="800">Servidores Conectados</text>
  <text x="250" y="102" fill="#8e8ea0" font-family="sans-serif" font-size="13">Navegación nativa y streaming directo desde tus servidores de música sin esperas</text>

  <!-- Server Card 1: Navidrome (Subsonic REST API) -->
  <rect x="250" y="120" width="730" height="110" rx="12" fill="#181822" stroke="#00F5D4" stroke-width="1.5"/>
  <circle cx="288" cy="175" r="24" fill="#162b29"/>
  <text x="288" y="182" fill="#00F5D4" font-family="sans-serif" font-size="20" text-anchor="middle">📡</text>
  
  <text x="328" y="156" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700">Navidrome Home Server</text>
  <rect x="520" y="142" width="140" height="20" rx="5" fill="#2d1c42" stroke="#7B2CBF" stroke-width="1"/>
  <text x="590" y="156" fill="#c084fc" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">Subsonic / Navidrome</text>

  <rect x="670" y="142" width="70" height="20" rx="5" fill="#162b29" stroke="#00F5D4" stroke-width="1"/>
  <text x="705" y="156" fill="#00F5D4" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">✓ En línea</text>

  <text x="328" y="180" fill="#8e8ea0" font-family="sans-serif" font-size="12">https://music.boumusic.lan:4533 • Usuario: admin • Token Salt Auth (v1.16.1)</text>
  <text x="328" y="202" fill="#00F5D4" font-family="sans-serif" font-size="12" font-weight="600">📂 Explorando: /artists • 1.420 artistas • 3.850 álbumes • Streaming PCM Directo</text>

  <!-- Server Card 2: SMB NAS -->
  <rect x="250" y="246" width="730" height="96" rx="12" fill="#15151e" stroke="#2c2c3e" stroke-width="1"/>
  <circle cx="288" cy="294" r="24" fill="#1f1f2c"/>
  <text x="288" y="301" fill="#c084fc" font-family="sans-serif" font-size="20" text-anchor="middle">🗄️</text>
  
  <text x="328" y="278" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="700">Synology NAS (SMB Share)</text>
  <rect x="525" y="265" width="130" height="20" rx="5" fill="#1a1a26" stroke="#4a4a60" stroke-width="1"/>
  <text x="590" y="279" fill="#a0a0b8" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">SMB (Windows/Linux)</text>

  <text x="328" y="302" fill="#8e8ea0" font-family="sans-serif" font-size="12">smb://192.168.1.150:445/Musica • Protocolo SMB2/SMB3 nativo sin montar unidad</text>
  <text x="328" y="324" fill="#a0a0b8" font-family="sans-serif" font-size="11">Credenciales cifradas con AES-GCM (enc:v1:)</text>

  <!-- Dialog Overlay: Adding Subsonic Server -->
  <rect x="360" y="160" width="530" height="420" rx="16" fill="#15151e" stroke="#00F5D4" stroke-width="1.8" filter="drop-shadow(0 15px 30px rgba(0,0,0,0.8))"/>
  
  <text x="390" y="196" fill="#ffffff" font-family="sans-serif" font-size="17" font-weight="800">Añadir Servidor Subsonic / Navidrome</text>
  
  <!-- Protocol Chips -->
  <text x="390" y="228" fill="#8e8ea0" font-family="sans-serif" font-size="11">Protocolo:</text>
  <rect x="390" y="238" width="50" height="26" rx="6" fill="#1c1c28"/>
  <text x="415" y="255" fill="#8e8ea0" font-family="sans-serif" font-size="11" text-anchor="middle">FTP</text>
  
  <rect x="448" y="238" width="54" height="26" rx="6" fill="#1c1c28"/>
  <text x="475" y="255" fill="#8e8ea0" font-family="sans-serif" font-size="11" text-anchor="middle">SMB</text>

  <rect x="510" y="238" width="65" height="26" rx="6" fill="#1c1c28"/>
  <text x="542" y="255" fill="#8e8ea0" font-family="sans-serif" font-size="11" text-anchor="middle">WebDAV</text>

  <rect x="583" y="238" width="190" height="26" rx="6" fill="#7B2CBF"/>
  <text x="678" y="255" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">✓ Subsonic / Navidrome / Jellyfin</text>

  <!-- Input Fields -->
  <text x="390" y="288" fill="#8e8ea0" font-family="sans-serif" font-size="11">Nombre del Servidor:</text>
  <rect x="390" y="296" width="470" height="34" rx="6" fill="#1d1d2b" stroke="#333348" stroke-width="1"/>
  <text x="402" y="318" fill="#ffffff" font-family="sans-serif" font-size="12">Navidrome Casa (Fibra)</text>

  <text x="390" y="350" fill="#8e8ea0" font-family="sans-serif" font-size="11">Host / URL del Servidor:</text>
  <rect x="390" y="358" width="340" height="34" rx="6" fill="#1d1d2b" stroke="#00F5D4" stroke-width="1"/>
  <text x="402" y="380" fill="#00F5D4" font-family="sans-serif" font-size="12">https://music.boumusic.lan</text>

  <text x="746" y="350" fill="#8e8ea0" font-family="sans-serif" font-size="11">Puerto:</text>
  <rect x="746" y="358" width="114" height="34" rx="6" fill="#1d1d2b" stroke="#333348" stroke-width="1"/>
  <text x="758" y="380" fill="#ffffff" font-family="sans-serif" font-size="12">4533</text>

  <text x="390" y="412" fill="#8e8ea0" font-family="sans-serif" font-size="11">Usuario:</text>
  <rect x="390" y="420" width="225" height="34" rx="6" fill="#1d1d2b" stroke="#333348" stroke-width="1"/>
  <text x="402" y="442" fill="#ffffff" font-family="sans-serif" font-size="12">bouet</text>

  <text x="635" y="412" fill="#8e8ea0" font-family="sans-serif" font-size="11">Contraseña (AES-GCM):</text>
  <rect x="635" y="420" width="225" height="34" rx="6" fill="#1d1d2b" stroke="#333348" stroke-width="1"/>
  <text x="647" y="444" fill="#ffffff" font-family="sans-serif" font-size="14">••••••••••••••••</text>

  <!-- Test Connection Button & Result -->
  <rect x="390" y="472" width="170" height="32" rx="6" fill="#192a27" stroke="#00F5D4" stroke-width="1"/>
  <text x="475" y="493" fill="#00F5D4" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">🔄 Probar conexión</text>

  <rect x="390" y="512" width="470" height="28" rx="6" fill="#122b25"/>
  <text x="402" y="530" fill="#00F5D4" font-family="sans-serif" font-size="11" font-weight="600">✓ Conexión establecida: Subsonic REST API v1.16.1 (Navidrome)</text>

  <!-- Save Button -->
  <rect x="710" y="546" width="150" height="34" rx="8" fill="#00F5D4"/>
  <text x="785" y="568" fill="#0a0a0c" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">Guardar y Conectar</text>
</svg>
